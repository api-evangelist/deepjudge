aid: deepjudge
name: Deepjudge
description: >-
  DeepJudge is an AI-powered legal knowledge search and intelligence platform
  for law firms and in-house legal teams, founded by ex-Google search engineers
  and legaltech veterans. It unifies scattered institutional knowledge across
  document management systems, SharePoint, HighQ, OneDrive, email, and intranets
  into a single governed, permission-aware search layer, then layers LLM-agnostic
  AI agents and workflow automation on top. Products include DeepJudge Knowledge
  Search, AI Workflows, Negotiation Intelligence, Multi-Document Chat, Matter &
  Client Overview, and SuperSearch for cross-matter analysis. The platform can be
  hosted in DeepJudge's cloud, the customer's cloud, or on premises, supports
  Model Context Protocol (MCP) for governed AI access to firm knowledge, and does
  not train on customer data. DeepJudge is SOC 2 Type II and ISO 27001 certified.
